<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form-top">
                <span>HiddenStage</span>    
            </div>
            
            <div class="form" id="form">
                <form class="login">
                     <h2>Bienvenido a HiddenStage</h2>
                <p>Ingresa tu información de inicio de sesión</p>
                <div class="input">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Ingresa tu email">
                </div>
                <div class="input">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="Ingresa tu contraseña">
                </div>
                <div class="reminder">
                    <div class="checkbox-container">
                        <input type="checkbox" id="terms">
                        <label for="terms">Recuerda por 30 días</label> 
                    </div>
                    <span class="forgot">¿Olvidaste tu contraseña?</span>
                </div>
                <div class="buttons">
                    <button>Iniciar Sesión</button>
                    <button>
                        <img src="/google.webp" alt="google" class="google-icon">
                        Google
                    </button>
                </div>
                <p class="account">No teienes una cuenta?<a href="#" id="sign-up"> Regístrate aquí</a></p>
            </form>

             <form class="register">
                     <h2>Crea tu cuenta</h2>
                <p>Ingresa tu información de registro</p>
                <div class="input">
                    <label for="name">Tu nombre</label>
                    <input type="text" name="name" id="name" placeholder="Ingresa tu nombre">
                </div>
                <div class="input">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Ingresa tu email">
                </div>
                <div class="input">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="Ingresa tu contraseña">
                </div>
                <div class="buttons">
                    <button>Crear Cuenta</button>
                    <button>
                        <img src="/google.webp" alt="google" class="google-icon">
                        Google
                    </button>
                </div>
                <p class="account">Ya tienes una cuenta?<a href="#" id="sign-in"> Inicia sesión</a></p>
            </form>
            </div>
            <div class="form-bot">
                 <span>© HiddenStage 2026</span>
            </div>
        </div>
        <div class="banner">
 
        </div>
    </div>
    <script src="/java.js"></script>

</body>
</html>
