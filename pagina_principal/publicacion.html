<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiddenStage | Publicación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="publicacion.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-main">
            <a class="brand" href="pagina_principal.html" aria-label="HiddenStage Inicio">
                <img src="../img/LogoHS.png" alt="HiddenStage" class="brand-logo">
            </a>
            <div class="spacer"></div>
            <div class="language-control">
                <label for="langSelector" data-i18n="menu.idioma">Idioma</label>
                <select id="langSelector" aria-label="Selector de idioma">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
            <button type="button" class="back-btn" onclick="window.history.back()" title="Volver">
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>
    </header>

    <main class="publication-page">
        <div class="container">
            <!-- Información de la Publicación -->
            <article id="postContent" class="post-article">
                <!-- Encabezado del Autor -->
                <div class="post-header">
                    <div class="author-info">
                        <div id="authorAvatar" class="author-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="author-details">
                            <strong id="authorName" data-i18n="publicacion.author">Usuario</strong>
                            <span id="postDate" data-i18n="publicacion.published">Hace poco</span>
                        </div>
                    </div>
                    <a id="categoryTag" href="#" class="category-tag" data-i18n="publicacion.category">Categoría</a>
                </div>

                <!-- Título y Encabezado -->
                <div class="post-title-section">
                    <h1 id="postTitle">Título de la publicación</h1>
                    <p id="postHeading" class="post-heading">Encabezado descriptivo</p>
                </div>

                <!-- Imagen Principal -->
                <div id="imageSection" class="post-image-section">
                    <img id="mainImage" src="" alt="Imagen principal" class="post-image">
                </div>

                <!-- Contenido de la Publicación -->
                <div id="postContentText" class="post-content-text">
                    <!-- El contenido se cargará aquí -->
                </div>

                <!-- Galería de Imágenes -->
                <div id="gallerySection" class="post-gallery">
                    <!-- Las imágenes se cargarán aquí -->
                </div>

                <!-- Enlaces -->
                <div id="linksSection" class="post-links">
                    <!-- Los enlaces se cargarán aquí -->
                </div>
            </article>

            <!-- Sección de Interacciones -->
            <section class="community-section">
                <h2 data-i18n="publicacion.community">¿Qué opina la comunidad?</h2>

                <!-- Botones de Reacción -->
                <div class="reaction-bar">
                    <button class="reaction-btn hype-btn" id="hypeBtn" onclick="toggleHype()">
                        <i class="fas fa-fire"></i>
                        <span data-i18n="publicacion.hype">HYPE!</span>
                        <span id="hypeCount">0</span>
                    </button>
                    <button class="reaction-btn like-btn" id="likeBtn" onclick="toggleLike()">
                        <i class="fas fa-heart"></i>
                        <span data-i18n="publicacion.like"></span>
                        <span id="likeCount">0</span>
                    </button>
                    <button class="reaction-btn save-btn" id="saveBtn" onclick="toggleSavePublication()">
                        <i class="fas fa-bookmark"></i>
                        <span id="saveBtnLabel" data-i18n="publicacion.save">Guardar</span>
                    </button>
                    <button class="reaction-btn comment-btn" onclick="scrollToComments()">
                        <i class="fas fa-comment"></i>
                        <span id="commentCount">0</span>
                    </button>
                </div>

                <!-- Comentarios -->
                <div class="comments-container">
                    <h3 data-i18n="publicacion.community_title">Comunidad</h3>
                    <div id="commentList" class="comment-list">
                        <!-- Los comentarios se cargarán aquí -->
                    </div>
                </div>

                <!-- Formulario de Comentario -->
                <div class="comment-form">
                    <h3 data-i18n="publicacion.write_comment">Escribe un comentario</h3>
                    <p class="logged-user"><span data-i18n="publicacion.commenting_as">Comentando como:</span> <strong id="displayUserName">Invitado</strong></p>
                    <textarea 
                        id="userComment" 
                        placeholder="Escribe tu comentario aquí..." 
                        rows="4"
                        maxlength="500"
                    ></textarea>
                    <small id="commentCharCount">0/500</small>
                    <button onclick="postComment()" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Publicar comentario
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/lang.js"></script>

    <script>
        const SESSION_KEY = 'hiddenstageUser';
        const THEME_KEY = 'hiddenstageTheme';
        const LOCAL_API_ORIGIN = 'http://localhost:3000';
        const isLocalFrontend =
            window.location.protocol === 'file:' ||
            ['localhost', '127.0.0.1'].includes(window.location.hostname);
        const isBackendOrigin = window.location.origin === LOCAL_API_ORIGIN;

        const API_BASE = isLocalFrontend && !isBackendOrigin
            ? LOCAL_API_ORIGIN
            : '';

        const getSessionUser = () => {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object') return null;
                return parsed;
            } catch {
                return null;
            }
        };

        const escapeHtml = (value) => {
            const text = String(value ?? '');
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };

        const getTotalCommentCount = (comments) => {
            return (comments || []).reduce((acc, comment) => {
                const replies = Array.isArray(comment.respuestas) ? comment.respuestas.length : 0;
                return acc + 1 + replies;
            }, 0);
        };

        // Aplicar tema
        const applyTheme = () => {
            const storedTheme = localStorage.getItem(THEME_KEY);
            document.body.dataset.theme = storedTheme === 'dark' ? 'dark' : 'light';
        };

        applyTheme();

        // Obtener ID de la publicación desde URL
        const getPostId = () => {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('id')) || null;
        };

        const renderNotFound = () => {
            document.body.innerHTML = '<p style="text-align:center; padding: 20px;">Publicación no encontrada</p>';
        };

        const parseJsonArray = (value) => {
            if (!value) return [];
            if (Array.isArray(value)) return value;
            if (typeof value === 'string') {
                try {
                    const parsed = JSON.parse(value);
                    return Array.isArray(parsed) ? parsed : [];
                } catch (error) {
                    return [];
                }
            }
            return [];
        };

        const getCommentCountFromServer = (comments) => Array.isArray(comments) ? comments.length : 0;

        const isCommentingAllowed = (user) => Boolean(user && !user.isGuest && Number(user.id_rol) !== 6);

        const isReactionAllowed = (user) => Boolean(user && !user.isGuest && Number(user.id_rol) !== 6);

        const reactionState = {
            user_like: false,
            user_hype: false
        };

        const saveState = {
            saved: false,
            canSave: true
        };

        const getLocalizedText = (key, fallback) => window.hiddenstageGetTranslation?.(key, fallback) || fallback;

        const updateSaveButtonUI = () => {
            const saveBtn = document.getElementById('saveBtn');
            const saveBtnLabel = document.getElementById('saveBtnLabel');

            if (!saveBtn || !saveBtnLabel) {
                return;
            }

            const isSaved = Boolean(saveState.saved);
            const canSave = Boolean(saveState.canSave);

            saveBtn.classList.toggle('saved', isSaved);
            saveBtn.disabled = !canSave;
            saveBtn.setAttribute('aria-pressed', String(isSaved));

            if (!canSave) {
                saveBtn.removeAttribute('title');
                saveBtnLabel.textContent = getLocalizedText('publicacion.save', 'Guardar');
                return;
            }

            saveBtn.title = isSaved
                ? getLocalizedText('publicacion.saved', 'Guardado')
                : getLocalizedText('publicacion.save', 'Guardar');
            saveBtnLabel.textContent = isSaved
                ? getLocalizedText('publicacion.saved', 'Guardado')
                : getLocalizedText('publicacion.save', 'Guardar');
        };

        const setReactionButtonState = (buttonId, active) => {
            const button = document.getElementById(buttonId);
            if (!button) {
                return;
            }

            button.classList.toggle('active', Boolean(active));
        };

        const configureReactionButtons = () => {
            const userData = getSessionUser();
            const hypeBtn = document.getElementById('hypeBtn');
            const likeBtn = document.getElementById('likeBtn');
            const allowed = isReactionAllowed(userData);

            if (hypeBtn) {
                hypeBtn.disabled = !allowed;
                hypeBtn.title = !allowed
                    ? 'Debes iniciar sesión para reaccionar.'
                    : (reactionState.user_hype ? 'Quitar HYPE' : 'Dar HYPE');
                hypeBtn.classList.toggle('active', Boolean(reactionState.user_hype));
            }

            if (likeBtn) {
                likeBtn.disabled = !allowed;
                likeBtn.title = !allowed
                    ? 'Debes iniciar sesión para reaccionar.'
                    : (reactionState.user_like ? 'Quitar like' : 'Dar like');
                likeBtn.classList.toggle('active', Boolean(reactionState.user_like));
            }
        };

        const loadSavedState = async () => {
            const postId = getPostId();
            const userData = getSessionUser();

            saveState.saved = false;
            saveState.canSave = Boolean(window.currentPost?.estado === 'aprobada');

            if (!postId || !saveState.canSave) {
                updateSaveButtonUI();
                return;
            }

            if (!userData?.id_usuario) {
                updateSaveButtonUI();
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/publicaciones-principales/${postId}/guardado?id_usuario=${encodeURIComponent(userData.id_usuario)}`);
                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    saveState.saved = Boolean(data?.guardado);
                }
            } catch (error) {
                saveState.saved = false;
            }

            updateSaveButtonUI();
        };

        const toggleSavePublication = async () => {
            const postId = getPostId();
            const userData = getSessionUser();

            if (!postId) {
                alert('Publicación no encontrada');
                return;
            }

            if (!saveState.canSave) {
                return;
            }

            if (!userData?.id_usuario) {
                alert(getLocalizedText('publicacion.login_save', 'Debes iniciar sesión para guardar publicaciones.'));
                return;
            }

            const method = saveState.saved ? 'DELETE' : 'POST';

            try {
                const response = await fetch(`${API_BASE}/api/publicaciones-principales/${postId}/guardar`, {
                    method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id_usuario: userData.id_usuario })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    alert(data.message || 'No se pudo actualizar el guardado.');
                    return;
                }

                saveState.saved = method === 'POST';
                updateSaveButtonUI();
            } catch (error) {
                alert('No se pudo conectar con el servidor.');
            }
        };

        window.toggleSavePublication = toggleSavePublication;

        const configureCommentForm = () => {
            const userData = getSessionUser();
            const commentInput = document.getElementById('userComment');
            const commentButton = document.querySelector('.comment-form .btn.btn-primary');
            const loggedUserLabel = document.querySelector('.logged-user strong#displayUserName');

            if (!commentInput || !commentButton) {
                return;
            }

            if (!isCommentingAllowed(userData)) {
                commentInput.disabled = true;
                commentButton.disabled = true;
                commentInput.placeholder = 'Debes iniciar sesión para comentar.';

                if (loggedUserLabel) {
                    loggedUserLabel.textContent = 'Debes iniciar sesión para comentar.';
                }

                return;
            }

            commentInput.disabled = false;
            commentButton.disabled = false;
            commentInput.placeholder = 'Escribe tu comentario aquí...';

            if (loggedUserLabel) {
                loggedUserLabel.textContent = userData.username || 'Invitado';
            }
        };

        const loadReactions = async () => {
            const postId = getPostId();

            if (!postId) {
                document.getElementById('hypeCount').textContent = '0';
                document.getElementById('likeCount').textContent = '0';
                reactionState.user_like = false;
                reactionState.user_hype = false;
                configureReactionButtons();
                return;
            }

            const userData = getSessionUser();

            try {
                let url = `${API_BASE}/api/reacciones/resumen?tipo_contenido=publicacion_principal&id_contenido=${encodeURIComponent(postId)}`;

                if (userData?.id_usuario) {
                    url += `&id_usuario=${encodeURIComponent(userData.id_usuario)}`;
                }

                const response = await fetch(url);

                if (!response.ok) {
                    document.getElementById('hypeCount').textContent = '0';
                    document.getElementById('likeCount').textContent = '0';
                    reactionState.user_like = false;
                    reactionState.user_hype = false;
                    configureReactionButtons();
                    return;
                }

                const data = await response.json();
                const totalHype = Number(data?.total_hype || 0);
                const totalLike = Number(data?.total_like || 0);

                reactionState.user_like = Boolean(data?.user_like);
                reactionState.user_hype = Boolean(data?.user_hype);

                document.getElementById('hypeCount').textContent = String(totalHype);
                document.getElementById('likeCount').textContent = String(totalLike);

                setReactionButtonState('hypeBtn', reactionState.user_hype);
                setReactionButtonState('likeBtn', reactionState.user_like);
                configureReactionButtons();
            } catch (error) {
                document.getElementById('hypeCount').textContent = '0';
                document.getElementById('likeCount').textContent = '0';
                reactionState.user_like = false;
                reactionState.user_hype = false;
                configureReactionButtons();
            }
        };

        const syncReaction = async (tipoReaccion) => {
            const userData = getSessionUser();
            const postId = getPostId();

            if (!postId || !isReactionAllowed(userData)) {
                alert('Debes iniciar sesión para reaccionar.');
                return;
            }

            const alreadyReacted = tipoReaccion === 'hype'
                ? reactionState.user_hype
                : reactionState.user_like;

            const method = alreadyReacted ? 'DELETE' : 'POST';

            try {
                const response = await fetch(`${API_BASE}/api/reacciones`, {
                    method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id_usuario: userData.id_usuario,
                        tipo_contenido: 'publicacion_principal',
                        id_contenido: postId,
                        tipo_reaccion: tipoReaccion
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok && response.status !== 409) {
                    alert(data.message || 'No se pudo procesar la reacción.');
                    return;
                }

                await loadReactions();
            } catch (error) {
                alert('No se pudo conectar con el servidor.');
            }
        };

        // Cargar publicación
        const loadPost = async () => {
            const postId = getPostId();
            if (!postId) {
                renderNotFound();
                return;
            }

            const sessionUser = getSessionUser();

            try {
                let url = `${API_BASE}/api/publicaciones-principales/${postId}`;
                if (sessionUser?.id_usuario) {
                    url += `?id_usuario=${encodeURIComponent(sessionUser.id_usuario)}`;
                }

                const response = await fetch(url);
                if (!response.ok) {
                    renderNotFound();
                    return;
                }

                const data = await response.json();
                const post = data?.publicacion;

                if (!post || typeof post !== 'object') {
                    renderNotFound();
                    return;
                }

                const authorName = post.username || post.autor_username || 'Usuario';
                const authorPhoto = post.foto_perfil || post.autor_foto_perfil || '';
                const category = post.categoria || '';
                const createdAt = post.created_at || null;
                const galleryImages = parseJsonArray(post.galeria_json);
                const links = parseJsonArray(post.enlaces_json);

                // Llenar datos
                document.getElementById('postTitle').textContent = post.titulo || '';
                document.getElementById('postHeading').textContent = post.encabezado || '';
                document.getElementById('authorName').textContent = authorName;
                document.getElementById('displayUserName').textContent = sessionUser?.username || 'Invitado';
                document.getElementById('categoryTag').textContent = category
                    ? category.charAt(0).toUpperCase() + category.slice(1)
                    : 'Categoría';
                document.getElementById('categoryTag').href = category
                    ? `pagina_principal.html#${category}`
                    : 'pagina_principal.html';
                document.getElementById('postDate').textContent = createdAt ? formatDate(createdAt) : 'Hace poco';
                document.getElementById('commentCount').textContent = '0';

                window.currentPost = post;
                saveState.canSave = post.estado === 'aprobada';
                await loadSavedState();

                // Avatar del autor
                const authorAvatar = document.getElementById('authorAvatar');
                if (authorPhoto) {
                    authorAvatar.style.backgroundImage = `url(${authorPhoto})`;
                    authorAvatar.classList.add('has-photo');
                } else {
                    authorAvatar.style.backgroundImage = '';
                    authorAvatar.classList.remove('has-photo');
                }

                // Imagen principal
                if (post.imagen_principal) {
                    document.getElementById('mainImage').src = post.imagen_principal;
                    document.getElementById('imageSection').style.display = '';
                } else {
                    document.getElementById('imageSection').style.display = 'none';
                }

                // Contenido
                document.getElementById('postContentText').innerHTML = escapeHtml(post.contenido || '').replace(/\n/g, '<br>');

                // Galería
                const gallerySection = document.getElementById('gallerySection');
                if (galleryImages.length > 0) {
                    gallerySection.style.display = '';
                    gallerySection.innerHTML = '<h3>Galería de imágenes</h3><div class="gallery-grid"></div>';
                    const galleryGrid = gallerySection.querySelector('.gallery-grid');
                    galleryImages.forEach((img) => {
                        const imageUrl = typeof img === 'string' ? img : '';
                        if (!imageUrl) return;
                        const imgEl = document.createElement('img');
                        imgEl.src = imageUrl;
                        imgEl.alt = 'Galería';
                        imgEl.className = 'gallery-img';
                        galleryGrid.appendChild(imgEl);
                    });
                    if (!galleryGrid.children.length) {
                        gallerySection.innerHTML = '';
                        gallerySection.style.display = 'none';
                    }
                } else {
                    gallerySection.innerHTML = '';
                    gallerySection.style.display = 'none';
                }

                // Enlaces
                const linksSection = document.getElementById('linksSection');
                if (links.length > 0) {
                    linksSection.style.display = '';
                    linksSection.innerHTML = '<h3>Enlaces útiles</h3><div class="links-list"></div>';
                    const linksList = linksSection.querySelector('.links-list');

                    links.forEach((link) => {
                        const url = typeof link === 'string'
                            ? link
                            : (typeof link?.url === 'string' ? link.url : '');
                        const title = typeof link === 'string'
                            ? link
                            : (typeof link?.title === 'string' ? link.title : url);

                        if (!url) return;

                        const anchor = document.createElement('a');
                        anchor.href = url;
                        anchor.target = '_blank';
                        anchor.rel = 'noopener noreferrer';
                        anchor.className = 'link-item';
                        anchor.innerHTML = `<i class="fas fa-link"></i> ${escapeHtml(title || url)}`;
                        linksList.appendChild(anchor);
                    });

                    if (!linksList.children.length) {
                        linksSection.innerHTML = '';
                        linksSection.style.display = 'none';
                    }
                } else {
                    linksSection.innerHTML = '';
                    linksSection.style.display = 'none';
                }

                configureCommentForm();
                configureReactionButtons();
                updateSaveButtonUI();
            } catch (error) {
                renderNotFound();
            }
        };

        // Formatear fecha
        const formatDate = (isoDate) => {
            const date = new Date(isoDate);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (days === 0) return 'Hoy';
            if (days === 1) return 'Ayer';
            if (days < 7) return `Hace ${days} días`;
            return date.toLocaleDateString('es-ES');
        };

        // Cargar comentarios desde backend
        const loadComments = async () => {
            const commentList = document.getElementById('commentList');
            const postId = getPostId();

            if (!postId) {
                commentList.innerHTML = '<p class="no-comments">Aún no hay comentarios.</p>';
                document.getElementById('commentCount').textContent = '0';
                return;
            }

            commentList.innerHTML = '<p class="no-comments">Cargando comentarios...</p>';

            try {
                const response = await fetch(
                    `${API_BASE}/api/comentarios?tipo_contenido=publicacion_principal&id_contenido=${encodeURIComponent(postId)}`
                );

                if (!response.ok) {
                    commentList.innerHTML = '<p class="no-comments">Aún no hay comentarios.</p>';
                    document.getElementById('commentCount').textContent = '0';
                    return;
                }

                const data = await response.json();
                const comments = Array.isArray(data?.comentarios) ? data.comentarios : [];

                if (comments.length === 0) {
                    commentList.innerHTML = '<p class="no-comments">Aún no hay comentarios.</p>';
                    document.getElementById('commentCount').textContent = '0';
                    return;
                }

                commentList.innerHTML = '';

                comments.forEach((comment) => {
                    const commentEl = document.createElement('div');
                    commentEl.className = 'comment';
                    const safeUsername = escapeHtml(comment.username || 'Usuario');
                    const safeText = escapeHtml(comment.contenido || '');
                    const avatarInitials = escapeHtml((comment.username || 'US').substring(0, 2).toUpperCase());
                    const avatarPhoto = comment.foto_perfil || '';

                    commentEl.innerHTML = `
                        <div class="comment-avatar" ${avatarPhoto ? `style="background-image: url('${avatarPhoto}')"` : ''}>
                            ${!avatarPhoto ? avatarInitials : ''}
                        </div>
                        <div class="comment-content">
                            <div class="comment-header">
                                <strong>${safeUsername}</strong>
                                <span class="comment-date">${formatDate(comment.created_at)}</span>
                            </div>
                            <p>${safeText}</p>
                        </div>
                    `;
                    commentList.appendChild(commentEl);
                });

                document.getElementById('commentCount').textContent = String(getCommentCountFromServer(comments));
            } catch (error) {
                commentList.innerHTML = '<p class="no-comments">Aún no hay comentarios.</p>';
                document.getElementById('commentCount').textContent = '0';
            }
        };

        const toggleReplyForm = (commentId) => {
            void commentId;
            alert('Las respuestas estarán disponibles en una siguiente fase.');
        };

        const postReply = () => {
            alert('Las respuestas estarán disponibles en una siguiente fase.');
        };

        // Toggle HYPE
        const toggleHype = async () => {
            await syncReaction('hype');
        };

        // Toggle Like
        const toggleLike = async () => {
            await syncReaction('like');
        };

        // Publicar comentario
        const postComment = async () => {
            const userData = getSessionUser();
            const postId = getPostId();

            if (!userData || !isCommentingAllowed(userData)) {
                alert('Debes iniciar sesión para comentar.');
                return;
            }

            const commentText = document.getElementById('userComment').value.trim();
            if (!commentText) {
                alert('El comentario no puede estar vacío');
                return;
            }

            if (!postId) {
                alert('Publicación no encontrada');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/comentarios`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id_usuario: userData.id_usuario,
                        tipo_contenido: 'publicacion_principal',
                        id_contenido: postId,
                        contenido: commentText
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 403) {
                        alert('Debes iniciar sesión para comentar.');
                        return;
                    }

                    alert(data.message || 'No se pudo guardar el comentario');
                    return;
                }

                document.getElementById('userComment').value = '';
                document.getElementById('commentCharCount').textContent = '0/500';
                await loadComments();
            } catch (error) {
                alert('No se pudo conectar con el servidor.');
            }
        };

        // Contador de caracteres en comentario
        document.getElementById('userComment')?.addEventListener('input', (e) => {
            document.getElementById('commentCharCount').textContent = `${e.target.value.length}/500`;
        });

        // Scroll a comentarios
        const scrollToComments = () => {
            document.querySelector('.comments-container')?.scrollIntoView({ behavior: 'smooth' });
        };

        // Cargar publicación y comentarios al iniciar
        (async () => {
            await loadPost();
            await loadComments();
            await loadReactions();
            configureCommentForm();
            configureReactionButtons();
            updateSaveButtonUI();
        })();

        document.getElementById('langSelector')?.addEventListener('change', () => {
            updateSaveButtonUI();
        });
    </script>
</body>
</html>
