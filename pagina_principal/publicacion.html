<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiddenStage | Publicación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="publicacion.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-main">
            <a class="brand" href="pagina_principal.html" aria-label="HiddenStage Inicio">
                <img src="../img/LogoHS.png" alt="HiddenStage" class="brand-logo">
            </a>
            <div class="spacer"></div>
            <button type="button" class="back-btn" onclick="window.history.back()" title="Volver">
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>
    </header>

    <main class="publication-page">
        <div class="container">
            <!-- Información de la Publicación -->
            <article id="postContent" class="post-article">
                <!-- Encabezado del Autor -->
                <div class="post-header">
                    <div class="author-info">
                        <div id="authorAvatar" class="author-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="author-details">
                            <strong id="authorName">Usuario</strong>
                            <span id="postDate">Hace poco</span>
                        </div>
                    </div>
                    <a id="categoryTag" href="#" class="category-tag">Categoría</a>
                </div>

                <!-- Título y Encabezado -->
                <div class="post-title-section">
                    <h1 id="postTitle">Título de la publicación</h1>
                    <p id="postHeading" class="post-heading">Encabezado descriptivo</p>
                </div>

                <!-- Imagen Principal -->
                <div id="imageSection" class="post-image-section">
                    <img id="mainImage" src="" alt="Imagen principal" class="post-image">
                </div>

                <!-- Contenido de la Publicación -->
                <div id="postContentText" class="post-content-text">
                    <!-- El contenido se cargará aquí -->
                </div>

                <!-- Galería de Imágenes -->
                <div id="gallerySection" class="post-gallery">
                    <!-- Las imágenes se cargarán aquí -->
                </div>

                <!-- Enlaces -->
                <div id="linksSection" class="post-links">
                    <!-- Los enlaces se cargarán aquí -->
                </div>
            </article>

            <!-- Sección de Interacciones -->
            <section class="community-section">
                <h2>¿Qué opina la comunidad?</h2>

                <!-- Botones de Reacción -->
                <div class="reaction-bar">
                    <button class="reaction-btn hype-btn" id="hypeBtn" onclick="toggleHype()">
                        <i class="fas fa-fire"></i>
                        <span>HYPE!</span>
                        <span id="hypeCount">0</span>
                    </button>
                    <button class="reaction-btn like-btn" id="likeBtn" onclick="toggleLike()">
                        <i class="fas fa-heart"></i>
                        <span id="likeCount">0</span>
                    </button>
                    <button class="reaction-btn comment-btn" onclick="scrollToComments()">
                        <i class="fas fa-comment"></i>
                        <span id="commentCount">0</span>
                    </button>
                </div>

                <!-- Comentarios -->
                <div class="comments-container">
                    <h3>Comunidad</h3>
                    <div id="commentList" class="comment-list">
                        <!-- Los comentarios se cargarán aquí -->
                    </div>
                </div>

                <!-- Formulario de Comentario -->
                <div class="comment-form">
                    <h3>Escribe un comentario</h3>
                    <p class="logged-user">Comentando como: <strong id="displayUserName">Invitado</strong></p>
                    <textarea 
                        id="userComment" 
                        placeholder="Escribe tu comentario aquí..." 
                        rows="4"
                        maxlength="500"
                    ></textarea>
                    <small id="commentCharCount">0/500</small>
                    <button onclick="postComment()" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Publicar comentario
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script>
        const SESSION_KEY = 'hiddenstageUser';
        const THEME_KEY = 'hiddenstageTheme';
        const LOCAL_API_ORIGIN = 'http://localhost:3000';
        const isLocalFrontend =
            window.location.protocol === 'file:' ||
            ['localhost', '127.0.0.1'].includes(window.location.hostname);
        const isBackendOrigin = window.location.origin === LOCAL_API_ORIGIN;

        const API_BASE = isLocalFrontend && !isBackendOrigin
            ? LOCAL_API_ORIGIN
            : '';

        const getSessionUser = () => {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object') return null;
                return parsed;
            } catch {
                return null;
            }
        };

        const escapeHtml = (value) => {
            const text = String(value ?? '');
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };

        const getTotalCommentCount = (comments) => {
            return (comments || []).reduce((acc, comment) => {
                const replies = Array.isArray(comment.respuestas) ? comment.respuestas.length : 0;
                return acc + 1 + replies;
            }, 0);
        };

        // Aplicar tema
        const applyTheme = () => {
            const storedTheme = localStorage.getItem(THEME_KEY);
            document.body.dataset.theme = storedTheme === 'dark' ? 'dark' : 'light';
        };

        applyTheme();

        // Obtener ID de la publicación desde URL
        const getPostId = () => {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('id')) || null;
        };

        const renderNotFound = () => {
            document.body.innerHTML = '<p style="text-align:center; padding: 20px;">Publicación no encontrada</p>';
        };

        const parseJsonArray = (value) => {
            if (!value) return [];
            if (Array.isArray(value)) return value;
            if (typeof value === 'string') {
                try {
                    const parsed = JSON.parse(value);
                    return Array.isArray(parsed) ? parsed : [];
                } catch (error) {
                    return [];
                }
            }
            return [];
        };

        // Cargar publicación
        const loadPost = async () => {
            const postId = getPostId();
            if (!postId) {
                renderNotFound();
                return;
            }

            const sessionUser = getSessionUser();

            try {
                let url = `${API_BASE}/api/publicaciones-principales/${postId}`;
                if (sessionUser?.id_usuario) {
                    url += `?id_usuario=${encodeURIComponent(sessionUser.id_usuario)}`;
                }

                const response = await fetch(url);
                if (!response.ok) {
                    renderNotFound();
                    return;
                }

                const data = await response.json();
                const post = data?.publicacion;

                if (!post || typeof post !== 'object') {
                    renderNotFound();
                    return;
                }

                const authorName = post.username || post.autor_username || 'Usuario';
                const authorPhoto = post.foto_perfil || post.autor_foto_perfil || '';
                const category = post.categoria || '';
                const createdAt = post.created_at || null;
                const galleryImages = parseJsonArray(post.galeria_json);
                const links = parseJsonArray(post.enlaces_json);

                // Llenar datos
                document.getElementById('postTitle').textContent = post.titulo || '';
                document.getElementById('postHeading').textContent = post.encabezado || '';
                document.getElementById('authorName').textContent = authorName;
                document.getElementById('displayUserName').textContent = sessionUser?.username || 'Invitado';
                document.getElementById('categoryTag').textContent = category
                    ? category.charAt(0).toUpperCase() + category.slice(1)
                    : 'Categoría';
                document.getElementById('categoryTag').href = category
                    ? `pagina_principal.html#${category}`
                    : 'pagina_principal.html';
                document.getElementById('postDate').textContent = createdAt ? formatDate(createdAt) : 'Hace poco';
                document.getElementById('hypeCount').textContent = '0';
                document.getElementById('likeCount').textContent = '0';
                document.getElementById('commentCount').textContent = '0';

                // Avatar del autor
                const authorAvatar = document.getElementById('authorAvatar');
                if (authorPhoto) {
                    authorAvatar.style.backgroundImage = `url(${authorPhoto})`;
                    authorAvatar.classList.add('has-photo');
                } else {
                    authorAvatar.style.backgroundImage = '';
                    authorAvatar.classList.remove('has-photo');
                }

                // Imagen principal
                if (post.imagen_principal) {
                    document.getElementById('mainImage').src = post.imagen_principal;
                    document.getElementById('imageSection').style.display = '';
                } else {
                    document.getElementById('imageSection').style.display = 'none';
                }

                // Contenido
                document.getElementById('postContentText').innerHTML = escapeHtml(post.contenido || '').replace(/\n/g, '<br>');

                // Galería
                const gallerySection = document.getElementById('gallerySection');
                if (galleryImages.length > 0) {
                    gallerySection.style.display = '';
                    gallerySection.innerHTML = '<h3>Galería de imágenes</h3><div class="gallery-grid"></div>';
                    const galleryGrid = gallerySection.querySelector('.gallery-grid');
                    galleryImages.forEach((img) => {
                        const imageUrl = typeof img === 'string' ? img : '';
                        if (!imageUrl) return;
                        const imgEl = document.createElement('img');
                        imgEl.src = imageUrl;
                        imgEl.alt = 'Galería';
                        imgEl.className = 'gallery-img';
                        galleryGrid.appendChild(imgEl);
                    });
                    if (!galleryGrid.children.length) {
                        gallerySection.innerHTML = '';
                        gallerySection.style.display = 'none';
                    }
                } else {
                    gallerySection.innerHTML = '';
                    gallerySection.style.display = 'none';
                }

                // Enlaces
                const linksSection = document.getElementById('linksSection');
                if (links.length > 0) {
                    linksSection.style.display = '';
                    linksSection.innerHTML = '<h3>Enlaces útiles</h3><div class="links-list"></div>';
                    const linksList = linksSection.querySelector('.links-list');

                    links.forEach((link) => {
                        const url = typeof link === 'string'
                            ? link
                            : (typeof link?.url === 'string' ? link.url : '');
                        const title = typeof link === 'string'
                            ? link
                            : (typeof link?.title === 'string' ? link.title : url);

                        if (!url) return;

                        const anchor = document.createElement('a');
                        anchor.href = url;
                        anchor.target = '_blank';
                        anchor.rel = 'noopener noreferrer';
                        anchor.className = 'link-item';
                        anchor.innerHTML = `<i class="fas fa-link"></i> ${escapeHtml(title || url)}`;
                        linksList.appendChild(anchor);
                    });

                    if (!linksList.children.length) {
                        linksSection.innerHTML = '';
                        linksSection.style.display = 'none';
                    }
                } else {
                    linksSection.innerHTML = '';
                    linksSection.style.display = 'none';
                }

                // Comentarios/reacciones pendientes de migración
                loadComments([]);
                window.currentPost = post;
            } catch (error) {
                renderNotFound();
            }
        };

        // Formatear fecha
        const formatDate = (isoDate) => {
            const date = new Date(isoDate);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (days === 0) return 'Hoy';
            if (days === 1) return 'Ayer';
            if (days < 7) return `Hace ${days} días`;
            return date.toLocaleDateString('es-ES');
        };

        // Cargar comentarios
        const loadComments = (comments) => {
            const commentList = document.getElementById('commentList');
            commentList.innerHTML = '';

            if (comments.length === 0) {
                commentList.innerHTML = '<p class="no-comments">Sé el primero en comentar</p>';
                return;
            }

            comments.forEach(comment => {
                const commentEl = document.createElement('div');
                commentEl.className = 'comment';
                const commentId = Number(comment.id) || Date.now();
                const safeUsername = escapeHtml(comment.username || 'Usuario');
                const safeText = escapeHtml(comment.texto || '');
                const avatarInitials = escapeHtml((comment.username || 'US').substring(0, 2).toUpperCase());
                const replies = Array.isArray(comment.respuestas) ? comment.respuestas : [];

                const repliesHtml = replies.map((reply) => {
                    const replyUser = escapeHtml(reply.username || 'Usuario');
                    const replyText = escapeHtml(reply.texto || '');
                    const replyInitials = escapeHtml((reply.username || 'US').substring(0, 2).toUpperCase());
                    return `
                        <div class="reply-item">
                            <div class="reply-avatar" ${reply.userAvatar ? `style="background-image: url('${reply.userAvatar}')"` : ''}>
                                ${!reply.userAvatar ? replyInitials : ''}
                            </div>
                            <div class="reply-content">
                                <div class="reply-header">
                                    <strong>${replyUser}</strong>
                                    <span class="comment-date">${formatDate(reply.fecha)}</span>
                                </div>
                                <p>${replyText}</p>
                            </div>
                        </div>
                    `;
                }).join('');

                commentEl.innerHTML = `
                    <div class="comment-avatar" ${comment.userAvatar ? `style="background-image: url('${comment.userAvatar}')"` : ''}>
                        ${!comment.userAvatar ? avatarInitials : ''}
                    </div>
                    <div class="comment-content">
                        <div class="comment-header">
                            <strong>${safeUsername}</strong>
                            <span class="comment-date">${formatDate(comment.fecha)}</span>
                        </div>
                        <p>${safeText}</p>
                        <div class="comment-actions">
                            <button type="button" class="comment-reply-btn" onclick="toggleReplyForm(${commentId})">
                                <i class="fas fa-reply"></i> Responder
                            </button>
                        </div>
                        <div id="replyForm-${commentId}" class="reply-form hidden">
                            <textarea id="replyInput-${commentId}" placeholder="Escribe tu respuesta..." rows="3" maxlength="500"></textarea>
                            <div class="reply-form-actions">
                                <button type="button" class="btn btn-secondary" onclick="toggleReplyForm(${commentId})">Cancelar</button>
                                <button type="button" class="btn btn-primary" onclick="postReply(${commentId})">
                                    <i class="fas fa-paper-plane"></i> Responder
                                </button>
                            </div>
                        </div>
                        ${replies.length > 0 ? `<div class="reply-list">${repliesHtml}</div>` : ''}
                    </div>
                `;
                commentList.appendChild(commentEl);
            });
        };

        const toggleReplyForm = (commentId) => {
            const form = document.getElementById(`replyForm-${commentId}`);
            if (!form) return;
            form.classList.toggle('hidden');

            if (!form.classList.contains('hidden')) {
                const input = document.getElementById(`replyInput-${commentId}`);
                input?.focus();
            }
        };

        const postReply = (commentId) => {
            const userData = getSessionUser();
            if (!userData) {
                alert('Debes iniciar sesión para responder comentarios');
                return;
            }

            const replyInput = document.getElementById(`replyInput-${commentId}`);
            const replyText = replyInput?.value.trim() || '';
            if (!replyText) {
                alert('La respuesta no puede estar vacía');
                return;
            }

            alert('Las respuestas estarán disponibles en una siguiente fase.');
        };

        // Toggle HYPE
        const toggleHype = () => {
            if (!window.currentPost) return;

            const userData = getSessionUser();
            if (!userData) {
                alert('Debes iniciar sesión para dar HYPE');
                return;
            }

            alert('Las reacciones estarán disponibles en una siguiente fase.');
        };

        // Toggle Like
        const toggleLike = () => {
            if (!window.currentPost) return;

            const userData = getSessionUser();
            if (!userData) {
                alert('Debes iniciar sesión para dar like');
                return;
            }

            alert('Las reacciones estarán disponibles en una siguiente fase.');
        };

        // Publicar comentario
        const postComment = () => {
            const userData = getSessionUser();
            if (!userData) {
                alert('Debes iniciar sesión para comentar');
                return;
            }

            const commentText = document.getElementById('userComment').value.trim();
            if (!commentText) {
                alert('El comentario no puede estar vacío');
                return;
            }

            alert('Los comentarios estarán disponibles en una siguiente fase.');
        };

        // Contador de caracteres en comentario
        document.getElementById('userComment')?.addEventListener('input', (e) => {
            document.getElementById('commentCharCount').textContent = `${e.target.value.length}/500`;
        });

        // Scroll a comentarios
        const scrollToComments = () => {
            document.querySelector('.comments-container')?.scrollIntoView({ behavior: 'smooth' });
        };

        // Cargar publicación al iniciar
        loadPost();
    </script>
</body>
</html>
