<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiddenStage | Crear Publicación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="crearPublicacion.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-main">
            <a class="brand" href="pagina_principal.html" aria-label="HiddenStage Home">
                <img src="../img/LogoHS.png" alt="HiddenStage" class="brand-logo">
            </a>
            <h1 class="page-title" data-i18n="pageTitle">Crear Publicación</h1>
            <div class="spacer"></div>
        </div>
    </header>

    <main class="create-post-page">
        <div class="container">
            <form id="postForm" class="post-form">
                <!-- Título -->
                <div class="form-group">
                    <label for="titulo" data-i18n="postTitleLabel">Título de la publicación *</label>
                    <input 
                        type="text" 
                        id="titulo" 
                        name="titulo" 
                        placeholder="Ej: Los mejores juegos de 2026"
                        data-i18n-placeholder="postTitlePlaceholder"
                        required
                        maxlength="100"
                    >
                    <small id="tituloCount">0/100</small>
                </div>

                <!-- Encabezado/Resumen -->
                <div class="form-group">
                    <label for="encabezado" data-i18n="headlineLabel">Encabezado o resumen *</label>
                    <input 
                        type="text" 
                        id="encabezado" 
                        name="encabezado" 
                        placeholder="Breve descripción que aparecerá en la vista previa"
                        data-i18n-placeholder="headlinePlaceholder"
                        required
                        maxlength="200"
                    >
                    <small id="encabezadoCount">0/200</small>
                </div>

                <!-- Categoría -->
                <div class="form-group">
                    <label for="categoria" data-i18n="categoryLabel">Categoría *</label>
                    <select id="categoria" name="categoria" required>
                        <option value="" data-i18n="selectCategory">-- Selecciona una categoría --</option>
                        <option value="noticias" data-i18n="categoryNews">Noticias</option>
                        <option value="tips" data-i18n="categoryTips">Tips</option>
                        <option value="carreras" data-i18n="categoryRacing">Carreras</option>
                        <option value="plataformas" data-i18n="categoryPlatforms">Plataformas</option>
                        <option value="romance" data-i18n="categoryRomance">Romance</option>
                        <option value="porturnos" data-i18n="categoryTurnBased">Por Turnos</option>
                        <option value="accion" data-i18n="categoryAction">Acción</option>
                        <option value="aventuras" data-i18n="categoryAdventures">Aventuras</option>
                    </select>
                </div>

                <!-- Imagen Principal -->
                <div class="form-group">
                    <label for="imagenPrincipal" data-i18n="mainImageLabel">Imagen principal (portada)</label>
                    <div class="image-upload">
                        <input 
                            type="file" 
                            id="imagenPrincipal" 
                            name="imagenPrincipal" 
                            accept="image/*"
                        >
                        <label for="imagenPrincipal" class="upload-label">
                            <i class="fas fa-image"></i>
                            <span data-i18n="uploadImageText">Haz clic para subir imagen</span>
                        </label>
                    </div>
                    <div id="imagenPreview" class="image-preview"></div>
                </div>

                <!-- Galería de Imágenes -->
                <div class="form-group">
                    <label for="imagenGaleria" data-i18n="galleryLabel">Galería de imágenes (múltiples)</label>
                    <div class="image-upload multiple">
                        <input 
                            type="file" 
                            id="imagenGaleria" 
                            name="imagenGaleria" 
                            accept="image/*"
                            multiple
                        >
                        <label for="imagenGaleria" class="upload-label">
                            <i class="fas fa-images"></i>
                            <span data-i18n="uploadGalleryText">Haz clic para subir múltiples imágenes</span>
                        </label>
                    </div>
                    <div id="galeriaPreview" class="gallery-preview"></div>
                </div>

                <!-- Enlaces -->
                <div class="form-group">
                    <label data-i18n="usefulLinksLabel">Enlaces útiles</label>
                    <div id="linksContainer">
                        <div class="link-input-group">
                            <input 
                                type="text" 
                                class="link-title" 
                                placeholder="Nombre del enlace"
                                data-i18n-placeholder="linkNamePlaceholder"
                                maxlength="50"
                            >
                            <input 
                                type="url" 
                                class="link-url" 
                                placeholder="https://ejemplo.com"
                                data-i18n-placeholder="linkUrlPlaceholder"
                            >
                            <button type="button" class="btn-remove-link" onclick="removeLink(this)">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <button type="button" class="btn-add-link" onclick="addLink()">
                        <i class="fas fa-plus"></i> <span data-i18n="addLink">Agregar enlace</span>
                    </button>
                </div>

                <!-- Contenido de la Publicación -->
                <div class="form-group">
                    <label for="contenido" data-i18n="postContentLabel">Desarrollo textual de la publicación *</label>
                    <textarea 
                        id="contenido" 
                        name="contenido" 
                        placeholder="Escribe el contenido completo de tu publicación aquí..."
                        data-i18n-placeholder="postContentPlaceholder"
                        required
                        rows="15"
                        maxlength="5000"
                    ></textarea>
                    <small id="contenidoCount">0/5000</small>
                </div>

                <!-- Botones de Acción -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.history.back()" data-i18n="cancel">
                        <i class="fas fa-arrow-left"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary" data-i18n="publish">
                        <i class="fas fa-check"></i> Publicar
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const LANGUAGE_KEY = 'hiddenstageLanguage';
        const UI_TRANSLATIONS = {
            es: {
                pageTitle: 'Crear Publicación',
                postTitleLabel: 'Título de la publicación *',
                postTitlePlaceholder: 'Ej: Los mejores juegos de 2026',
                headlineLabel: 'Encabezado o resumen *',
                headlinePlaceholder: 'Breve descripción que aparecerá en la vista previa',
                categoryLabel: 'Categoría *',
                selectCategory: '-- Selecciona una categoría --',
                categoryNews: 'Noticias',
                categoryTips: 'Tips',
                categoryRacing: 'Carreras',
                categoryPlatforms: 'Plataformas',
                categoryRomance: 'Romance',
                categoryTurnBased: 'Por Turnos',
                categoryAction: 'Acción',
                categoryAdventures: 'Aventuras',
                mainImageLabel: 'Imagen principal (portada)',
                uploadImageText: 'Haz clic para subir imagen',
                galleryLabel: 'Galería de imágenes (múltiples)',
                uploadGalleryText: 'Haz clic para subir múltiples imágenes',
                usefulLinksLabel: 'Enlaces útiles',
                linkNamePlaceholder: 'Nombre del enlace',
                linkUrlPlaceholder: 'https://ejemplo.com',
                addLink: 'Agregar enlace',
                postContentLabel: 'Desarrollo textual de la publicación *',
                postContentPlaceholder: 'Escribe el contenido completo de tu publicación aquí...',
                cancel: 'Cancelar',
                publish: 'Publicar',
                loginAlert: 'Debes iniciar sesión para crear una publicación'
            },
            en: {
                pageTitle: 'Create Post',
                postTitleLabel: 'Post title *',
                postTitlePlaceholder: 'Ex: Best games of 2026',
                headlineLabel: 'Headline or summary *',
                headlinePlaceholder: 'Short description that appears in preview',
                categoryLabel: 'Category *',
                selectCategory: '-- Select a category --',
                categoryNews: 'News',
                categoryTips: 'Tips',
                categoryRacing: 'Racing',
                categoryPlatforms: 'Platformers',
                categoryRomance: 'Romance',
                categoryTurnBased: 'Turn-based',
                categoryAction: 'Action',
                categoryAdventures: 'Adventures',
                mainImageLabel: 'Main image (cover)',
                uploadImageText: 'Click to upload image',
                galleryLabel: 'Image gallery (multiple)',
                uploadGalleryText: 'Click to upload multiple images',
                usefulLinksLabel: 'Useful links',
                linkNamePlaceholder: 'Link name',
                linkUrlPlaceholder: 'https://example.com',
                addLink: 'Add link',
                postContentLabel: 'Post content *',
                postContentPlaceholder: 'Write your full post content here...',
                cancel: 'Cancel',
                publish: 'Publish',
                loginAlert: 'You must log in to create a post'
            }
        };

        function traducirTextoInterfaz(key, language) {
            const safeLanguage = language === 'en' ? 'en' : 'es';
            return UI_TRANSLATIONS[safeLanguage]?.[key] || UI_TRANSLATIONS.es[key] || key;
        }

        function aplicarTraduccionesInterfaz(languageName) {
            document.querySelectorAll('[data-i18n]').forEach((element) => {
                const key = element.dataset.i18n;
                element.textContent = traducirTextoInterfaz(key, languageName);
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach((element) => {
                const key = element.dataset.i18nPlaceholder;
                element.setAttribute('placeholder', traducirTextoInterfaz(key, languageName));
            });

            document.querySelectorAll('option[data-i18n]').forEach((opt) => {
                const key = opt.dataset.i18n;
                opt.textContent = traducirTextoInterfaz(key, languageName);
            });
        }

        function leerIdiomaGuardado() {
            const storedLanguage = localStorage.getItem(LANGUAGE_KEY);
            return storedLanguage === 'en' ? 'en' : 'es';
        }

        function aplicarIdioma(languageName) {
            const normalized = languageName === 'en' ? 'en' : 'es';
            document.documentElement.lang = normalized;
            aplicarTraduccionesInterfaz(normalized);
        }

        const SESSION_KEY = 'hiddenstageUser';
        const POSTS_KEY = 'hiddenstagePosts';
        const THEME_KEY = 'hiddenstageTheme';

        // Apply theme
        const applyTheme = () => {
            const storedTheme = localStorage.getItem(THEME_KEY);
            document.body.dataset.theme = storedTheme === 'dark' ? 'dark' : 'light';
        };

        applyTheme();
        aplicarIdioma(leerIdiomaGuardado());

        // Check session
        if (!localStorage.getItem(SESSION_KEY)) {
            alert(traducirTextoInterfaz('loginAlert', leerIdiomaGuardado()));
            window.location.href = '../inicio_de_sesion/index.html';
        }

        // Contadores de caracteres
        document.getElementById('titulo').addEventListener('input', (e) => {
            document.getElementById('tituloCount').textContent = `${e.target.value.length}/100`;
        });

        document.getElementById('encabezado').addEventListener('input', (e) => {
            document.getElementById('encabezadoCount').textContent = `${e.target.value.length}/200`;
        });

        document.getElementById('contenido').addEventListener('input', (e) => {
            document.getElementById('contenidoCount').textContent = `${e.target.value.length}/5000`;
        });

        // Preview de imagen principal
        document.getElementById('imagenPrincipal').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const preview = document.getElementById('imagenPreview');
                    preview.innerHTML = `
                        <div class="preview-item">
                            <img src="${event.target.result}" alt="Previsualización">
                            <button type="button" onclick="this.parentElement.remove(); document.getElementById('imagenPrincipal').value=''" class="btn-remove">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                };
                reader.readAsDataURL(file);
            }
        });

        // Preview de galería de imágenes
        document.getElementById('imagenGaleria').addEventListener('change', (e) => {
            const files = e.target.files;
            const preview = document.getElementById('galeriaPreview');
            preview.innerHTML = '';
            
            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const item = document.createElement('div');
                    item.className = 'preview-item';
                    item.innerHTML = `
                        <img src="${event.target.result}" alt="Imagen ${index + 1}">
                        <button type="button" onclick="removeGalleryImage(${index})" class="btn-remove">
                            <i class="fas fa-trash"></i>
                        </button>
                    `;
                    preview.appendChild(item);
                };
                reader.readAsDataURL(file);
            });
        });

        function removeGalleryImage(index) {
            const fileInput = document.getElementById('imagenGaleria');
            const dataTransfer = new DataTransfer();
            
            Array.from(fileInput.files).forEach((file, i) => {
                if (i !== index) {
                    dataTransfer.items.add(file);
                }
            });
            
            fileInput.files = dataTransfer.files;
            fileInput.dispatchEvent(new Event('change', { bubbles: true }));
        }

        // Funciones para gestionar enlaces
        function addLink() {
            const container = document.getElementById('linksContainer');
            const newLink = document.createElement('div');
            newLink.className = 'link-input-group';
            newLink.innerHTML = `
                <input type="text" class="link-title" placeholder="Nombre del enlace" data-i18n-placeholder="linkNamePlaceholder" maxlength="50">
                <input type="url" class="link-url" placeholder="https://ejemplo.com" data-i18n-placeholder="linkUrlPlaceholder">
                <button type="button" class="btn-remove-link" onclick="removeLink(this)">
                    <i class="fas fa-trash"></i>
                </button>
            `;
            container.appendChild(newLink);
            aplicarTraduccionesInterfaz(leerIdiomaGuardado());
        }

        function removeLink(btn) {
            btn.parentElement.remove();
        }

        // Enviar formulario
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const userData = JSON.parse(localStorage.getItem(SESSION_KEY));
            const posts = JSON.parse(localStorage.getItem(POSTS_KEY)) || [];

            // Recopilar enlaces
            const links = [];
            document.querySelectorAll('.link-input-group').forEach(group => {
                const title = group.querySelector('.link-title').value;
                const url = group.querySelector('.link-url').value;
                if (title && url) {
                    links.push({ title, url });
                }
            });

            // Convertir archivos a Data URLs
            const fileToDataURL = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            };

            const imagenPrincipalFiles = document.getElementById('imagenPrincipal').files;
            const imagenPrincipal = imagenPrincipalFiles.length > 0 
                ? await fileToDataURL(imagenPrincipalFiles[0]) 
                : '';

            const imagenGaleriaFiles = document.getElementById('imagenGaleria').files;
            const imagenGaleria = [];
            for (let file of imagenGaleriaFiles) {
                imagenGaleria.push(await fileToDataURL(file));
            }

            // Crear publicación
            const post = {
                id: Date.now(),
                userId: userData.id || userData.username,
                username: userData.username,
                userAvatar: userData.foto_perfil || '',
                titulo: document.getElementById('titulo').value,
                encabezado: document.getElementById('encabezado').value,
                categoria: document.getElementById('categoria').value,
                contenido: document.getElementById('contenido').value,
                imagenPrincipal: imagenPrincipal,
                imagenGaleria: imagenGaleria,
                links: links,
                fecha: new Date().toISOString(),
                likes: 0,
                comentarios: [],
                hypes: []
            };

            posts.push(post);
            localStorage.setItem(POSTS_KEY, JSON.stringify(posts));

            alert('Post created successfully!');
            window.location.href = 'pagina_principal.html#' + post.categoria;
        });
    </script>
</body>
</html>
