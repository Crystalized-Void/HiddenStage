<script>
    function Menu() {
        document.getElementById("sideMenu").classList.toggle("active");
    }
    function AjustesPerfil() {
        document.getElementById("sideProfile").classList.toggle("active");
    }

    // Cargar datos del usuario desde localStorage
    (function() {
        const raw = localStorage.getItem('hiddenstageUser');
        if (!raw) {
            window.location.href = 'index.html';
            return;
        }
        try {
            const user = JSON.parse(raw);
            const usernameEl = document.getElementById('header-username');
            const avatarEl = document.getElementById('header-avatar');
            if (usernameEl && user.username) usernameEl.textContent = user.username;
            if (avatarEl && user.foto_perfil) avatarEl.src = user.foto_perfil;
        } catch (e) {}
    })();

    document.getElementById('logout-link').addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.removeItem('hiddenstageUser');
        window.location.href = 'index.html';
    });
</script>
